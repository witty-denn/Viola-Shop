name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o hng15-lesson2-shop.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted
          rm -f hng15-lesson2-shop.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract HNG15 Lesson 2 project" || echo "No changes to commit"
          git push
